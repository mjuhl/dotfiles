# ============================================================================
# General settings
# ============================================================================

set -g default-terminal "tmux-256color"

# True color and hyperlinks for Ghostty
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-features ",xterm-ghostty:hyperlinks"
set -g allow-passthrough on

# Use Ctrl+Space as prefix
unbind-key C-b
set -g prefix C-space
bind-key space send-prefix

# Clipboard and mouse
set -g set-clipboard on
set -g mouse on

# Status and history
set-option -g status-position top
set-option -g history-limit 100000

# Window numbering
set -g base-index 1
set-option -g renumber-windows on

# Focus events for Vim
set -g focus-events on

# ============================================================================
# Key bindings
# ============================================================================

# Reload config
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# Copy mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection
bind-key -T copy-mode-vi 'y' send-keys -X copy-selection-and-cancel

# ============================================================================
# TPM plugins
# ============================================================================

# Auto-install TPM if missing
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

# Change tpm-clean keybinding to avoid Aerospace conflict
set -g @tpm-clean "C"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'Nybkox/tmux-ukiyo'

# Ukiyo theme settings
set -g @ukiyo-theme "kanagawa/dragon"
set -g @ukiyo-ignore-window-colors true
set -g @ukiyo-plugins "ssh-session"

# ============================================================================
# Initialize TPM (keep this at the bottom)
# ============================================================================
run '~/.config/tmux/plugins/tpm/tpm'

