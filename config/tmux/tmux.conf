## default keybindings:
#
# <leader> D — Detach from the current session.
# <leader> % — Split the window into two panes horizontally.
# <leader> " — Split the window into two panes vertically.
# <leader> Arrow Key (Left, Right, Up, Down) — Move between panes.
# <leader> X — Close pane.
# <leader> C — Create a new window.
# <leader> N or P — Move to the next or previous window.
# <leader> 0 (1,2...) — Move to a specific window by number.
# <leader> : — Enter the command line to type commands. Tab completion is available.
# <leader> ? — View all keybindings. Press Q to exit.
# <leader> W — Open a panel to navigate across windows in multiple sessions.
# <leader> [ - allows moving cursor around
#
# <leader> $ - rename session
##

## tpm keybindings:
#
# <prefix> + I - install
# <prefix> + U - update
# <prefix> + <a-u> - remove/uninstall plugins not on the list
##

## tmux commands
# `tmux new -s [name]` - new session
# `tmux list-sessions`
# `tmux attach -t [name]`
##

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"

# clickable hyperlinks in ghostty
## note: with mouse enabled, it's necessary to use shift+command+click in ghostty
## if mouse is not enabled, regular command+click works
set -as terminal-features ",xterm-ghostty:hyperlinks"
set -g allow-passthrough on

# use `C-space space [command]` to send a command to a tmux within a tmux
# bind-key space send-prefix

set -g set-clipboard on
set-option -g status-position top
# set-window-option -g mode-keys vi
set-option -g history-limit 100000
set -g mouse on

# prefix+r reloads config
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l


# automatic installation of tmux plugin manager if missing
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

# tpm clean/uninstall default keybinding is alt+u, which conflicts with aerospace bindings
set -g @tpm-clean "C"

# List of plugins
# set -g @plugin 'hallazzang/tmux-reset'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
# set -g @plugin 'catppuccin/tmux'
# set -g @catppuccin_flavor 'frappe' # latte, frappe, macchiato or mocha
# set -g @plugin "nordtheme/tmux"
# set -g @plugin 'leighmcculloch/tmux-colours-superhero'
set -g @plugin 'Nybkox/tmux-kanagawa'

set -g @kanagawa-theme 'dragon'
set -g @kanagawa-ignore-window-colors true

# set -g @kanagawa-plugins "ssh-session cpu-usage ram-usage weather time"
set -g @kanagawa-plugins "ssh-session"
set -g @kanagawa-show-ssh-only-when-connected true
# set -g @dracula-show-ssh-only-when-connected true


set -g base-index 1 # 1-based indexing of windows instead of 0
set-option -g renumber-windows on # renumber windows after closing one

# set prefix
unbind-key C-b
set -g prefix C-space

###
# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'

